apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    server:
      # Change this to a random string for public-facing deployments.
      # For internal cluster-only use (agent-api → searxng) this is fine as-is.
      secret_key: "agent-api-internal-searxng-key"
      limiter: false
      image_proxy: false

    search:
      safe_search: 0
      formats:
        - html
        - json

    engines:
      - name: google
        engine: google
        disabled: false
      - name: bing
        engine: bing
        disabled: false
      - name: duckduckgo
        engine: duckduckgo
        disabled: false
      - name: wikipedia
        engine: wikipedia
        disabled: false

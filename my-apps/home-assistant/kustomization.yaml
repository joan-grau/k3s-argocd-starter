apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - certificate.yaml
configMapGenerator:
  # Hash suffix makes a configuration.yaml edit roll the pod automatically
  - name: home-assistant-configuration
    files:
      - configuration.yaml

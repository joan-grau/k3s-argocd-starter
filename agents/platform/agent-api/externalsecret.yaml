apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-api-secrets
  namespace: agent-api
spec:
  secretStoreRef:
    name: doppler
    kind: SecretStore
  target:
    name: agent-api-secrets
    creationPolicy: CreateOrMerge   # self-heals if the Secret is ever deleted
  refreshInterval: 1h
  dataFrom:
    - find:
        name:
          regexp: ".*"
  data:
    - secretKey: db-password
      remoteRef:
        key: PASSWORD
      sourceRef:
        storeRef:
          name: doppler-postgresql
          kind: SecretStore
    - secretKey: redis-password
      remoteRef:
        key: PASSWORD
      sourceRef:
        storeRef:
          name: doppler-redis
          kind: SecretStore

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-api-secrets
  namespace: agent-api
spec:
  secretStoreRef:
    name: doppler
    kind: SecretStore
  target:
    name: agent-api-secrets
    creationPolicy: CreateOrMerge   # lets the cross-project ExternalSecrets below merge into the same Secret, and self-heals if the Secret is ever deleted
  refreshInterval: 1h
  dataFrom:
    - find:
        name:
          regexp: ".*"

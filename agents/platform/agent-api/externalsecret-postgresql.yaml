apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-api-secrets-db-password
  namespace: agent-api
spec:
  secretStoreRef:
    name: doppler-postgresql
    kind: SecretStore
  target:
    name: agent-api-secrets
    creationPolicy: CreateOrMerge
  refreshInterval: 1h
  data:
    - secretKey: db-password
      remoteRef:
        key: PASSWORD

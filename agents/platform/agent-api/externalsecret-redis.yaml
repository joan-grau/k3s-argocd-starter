apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-api-secrets-redis-password
  namespace: agent-api
spec:
  secretStoreRef:
    name: doppler-redis
    kind: SecretStore
  target:
    name: agent-api-secrets
    creationPolicy: CreateOrMerge
  refreshInterval: 1h
  data:
    - secretKey: redis-password
      remoteRef:
        key: PASSWORD

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  secretStoreRef:
    name: doppler
    kind: SecretStore
  target:
    name: n8n-secrets
    creationPolicy: CreateOrMerge   # self-heals if the Secret is ever deleted
  refreshInterval: 1h
  dataFrom:
    - find:
        name:
          regexp: ".*"
  data:
    - secretKey: db-password
      remoteRef:
        key: PASSWORD
      sourceRef:
        storeRef:
          name: doppler-postgresql
          kind: SecretStore

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  secretStoreRef:
    name: doppler
    kind: SecretStore
  target:
    name: n8n-secrets
    creationPolicy: CreateOrMerge   # lets the cross-project ExternalSecret below merge into the same Secret, and self-heals if the Secret is ever deleted
  refreshInterval: 1h
  dataFrom:
    - find:
        name:
          regexp: ".*"

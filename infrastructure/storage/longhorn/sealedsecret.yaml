# To seal a new secret value from the cluster:
#   echo -n "secret-value" | kubeseal --raw \
#     --name longhorn-r2-backup-secret --namespace longhorn-system \
#     --controller-name sealed-secrets --controller-namespace sealed-secrets \
#     --from-file=/dev/stdin
# Then paste the output as the value for the corresponding key below.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: longhorn-r2-backup-secret
  namespace: longhorn-system
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
    AWS_ENDPOINTS: 
  template:
    metadata:
      creationTimestamp: null
      name: longhorn-r2-backup-secret
      namespace: longhorn-system

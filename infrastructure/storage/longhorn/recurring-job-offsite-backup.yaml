apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: offsite-backup-daily
  namespace: longhorn-system
spec:
  # TEMP: set to 11:00 for testing the source-label fix; revert to "0 2 * * *" after verifying
  cron: "0 11 * * *"
  task: backup
  retain: 7
  concurrency: 2
  groups:
    - offsite-backup
  labels: {}
